[build]
  command = "npm run build:client"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://pizza-city-oman-production.up.railway.app//api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin/api/*"
  to = "https://pizza-city-oman-production.up.railway.app//admin/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
